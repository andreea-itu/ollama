<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Chain Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 1100px; }
    textarea { width: 100%; height: 180px; padding: 10px; font-size: 14px; }
    button { padding: 10px 12px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .card { border: 1px solid #ddd; padding: 12px; border-radius: 6px; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .dim { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Two-Model Email Chain</h1>
  <p class="dim">
    Paste an email. Model A classifies it (category + tone). Model B writes a reply based on that context.
  </p>

  <h2>Paste Email</h2>
  <textarea id="email" placeholder="Paste the email here..."></textarea>
  <div style="margin-top: 10px;">
    <button id="run">Classify + Draft Reply</button>
    <span id="status" class="dim"></span>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Model A Output (Classification Context)</h3>
      <pre id="classif">{}</pre>
    </div>
    <div class="card">
      <h3>Model B Output (Reply)</h3>
      <pre id="reply"></pre>
    </div>
  </div>

  <script>
    const emailEl = document.getElementById("email");
    const runBtn = document.getElementById("run");
    const statusEl = document.getElementById("status");
    const classifEl = document.getElementById("classif");
    const replyEl = document.getElementById("reply");

    runBtn.addEventListener("click", async () => {
      const emailText = emailEl.value.trim();
      if (!emailText) return;

      statusEl.textContent = "Running chain...";
      classifEl.textContent = "{}";
      replyEl.textContent = "";

      const res = await fetch("/email_chain", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email_text: emailText })
      });

      if (!res.ok) {
        statusEl.textContent = "Error: " + await res.text();
        return;
      }

      const data = await res.json();
      classifEl.textContent = JSON.stringify(data.classification, null, 2);
      replyEl.textContent = data.reply || "";
      statusEl.textContent = `Done in ${data.elapsed_ms} ms.`;
    });
  </script>
</body>
</html>
